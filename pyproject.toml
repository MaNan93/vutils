[project]
name = "vutils"
version = "0.1.0"
description = "Parse and edit Verilog/SystemVerilog module ports, wires, and instances using Tree-sitter"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-systemverilog>=0.4.1,<0.5",
]

[project.scripts]
vutils = "vutils.vcli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vutils*"]
exclude = ["vutils.tests*"]
